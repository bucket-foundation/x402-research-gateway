# Machine-readable registry of research sources.
#
# This file is the source of truth. RESEARCH-INDEX.md is generated from
# it by `make research-index`; do not hand-edit the generated tables.
#
# `status` is the provider lifecycle, so a source can be known and
# described long before an adapter exists. `excluded` records a decision
# not to operate a source; the research note is kept and no endpoints are
# registered.
#
# Rights are data. An absent or unknown rights block is NOT permission.
version: "1"
last_reviewed: "2026-04-21"
maintainer: "Gian"
providers:
  - provider_id: "arxiv"
    name: "arXiv (math.*)"
    provider_type: preprint_repository
    status: implemented
    section: "1.1"
    fields:
      - mathematics
      - physics
      - information_computation
    coverage: "Preprints in all math subj classes (AG, AT, CO, DG, NT, PR, ST…)"
    corpus_size: "~600k math preprints"
    base_url: "http://export.arxiv.org/api/query"
    source_prefix: "arxiv"
    canonical_url: "https://arxiv.org/abs/{id}"
    tier_fit: "raw (by id), query (search)"
    auth: "none"
    rate_limit: "1 request per 3 seconds, the published guidance; arXiv runs on donated infrastructure so this is a requirement"
    license: "per-record; arXiv non-exclusive through CC-BY variants to CC0"
    rights:
      metadata_license: "metadata freely available from the API"
      content_license: "per submission; the adapter reads arxiv:license per record"
      redistribution: unknown
      verified_on: "2026-08-17"
      notes: "Submission licences vary from CC0 through the CC-BY variants to the arXiv non-exclusive licence, which grants arXiv distribution rights and grants the reader none. A provider-level content licence would be wrong for most records, so rights are read per record and an absent statement reports unknown. Unknown is not permission."
    identifier_schemes:
      - arxiv
      - doi
    pagination: "offset via start + max_results; max_results capped at 2000 per call and 30000 results overall"
    bulk_access: true
    incremental_updates: true
    formats:
      - atom
    last_verified: "2026-08-17"
    route_ids:
      - arxiv-search
      - arxiv-fetch
    sync:
      modes:
        - oai_pmh
        - bulk_snapshot
      oai_pmh_endpoint: "http://export.arxiv.org/oai2"
      oai_pmh_metadata_prefixes:
        - oai_dc
        - arXiv
        - arXivRaw
      incremental_method: "OAI-PMH ListRecords with a from/until date window; resumption tokens page the set"
      cursor_semantics: "Resumption tokens are provider-issued and expire, so a resumed harvest re-requests from the last token rather than from an offset. Deletions appear as OAI-PMH deleted records."
      snapshots:
        - url: "https://info.arxiv.org/help/bulk_data_s3.html"
          format: "PDF and source tarballs in S3"
          update_frequency: "monthly manifests"
          auth: "requester-pays"
          rights:
            content_license: "per submission; the same per-record licences the API reports"
            redistribution: unknown
            notes: "Requester-pays access is permission to download, never permission to redistribute. Per-submission licences govern the content and most grant the reader nothing."
          notes: "Download costs fall on the requester. The gateway describes this channel and never proxies it."
      verified: false
      unverified_reason: "documented from the provider's own publication pages; not checked against a live fetch in this revision"
    notes: "Atom XML, parsed by the adapter's atom-style Normalizer; the declarative proxy path cannot express it. Versions are distinct objects and stay separately addressable: the record id keeps its vN suffix. A submission's arxiv:doi becomes a provider-asserted preprint_of relation feeding preprint-to-published identity resolution. Subject classification is preserved with its scheme. OAI-PMH incremental harvest is open; the full-text bulk sets are requester-pays object storage this gateway does not access, so bulk_access is false. Verified 2026-08-17."

  - provider_id: "zbmath-open-rest"
    name: "zbMATH Open REST"
    provider_type: scholarly_metadata
    status: implemented
    section: "1.1"
    fields:
      - mathematics
    coverage: "Reviewed math literature, abstracts, MSC classification with edition, author + classification graph"
    corpus_size: "~4.5M records"
    base_url: "https://api.zbmath.org/v1"
    source_prefix: "zbmath"
    canonical_url: "https://zbmath.org/{id}"
    tier_fit: "raw (by zbl id), query (/document/_search)"
    auth: "none, empirically confirmed by unauthenticated queries returning full records"
    rate_limit: "no numeric limit published on the API landing page as of 2026-08-17"
    license: "unverified this session at the record level; see rights notes"
    rights:
      metadata_license: "unknown"
      redistribution: unknown
      verified_on: "2026-08-17"
      notes: "Corrected from a prior CC-BY-4.0/allowed entry: this session's live queries found the API's own license field empty ([]) on every record sampled, and the zbMATH terms/about pages returned 403 to an unauthenticated fetch, so the prior claim could not be re-verified and is not carried forward as fact. Unknown is not permission. Distinct and more certain: review text is authored commentary a named or pseudonymous reviewer wrote, is never covered by any bibliographic-metadata licence, and this adapter never treats it as redistributable."
    identifier_schemes:
      - zbmath
      - doi
    pagination: "page"
    bulk_access: false
    incremental_updates: true
    formats:
      - json
    last_verified: "2026-08-17"
    route_ids:
      - zbmath-search
      - zbmath-fetch
    sync:
      modes:
        - oai_pmh
        - date_window
      oai_pmh_endpoint: "https://oai.zbmath.org/v1/"
      oai_pmh_metadata_prefixes:
        - oai_dc
        - oai_zb_preview
      incremental_method: "OAI-PMH ListRecords with a from/until window over the open subset"
      cursor_semantics: "Resumption tokens page the set and expire. Review text stays outside the open subset, so a complete harvest of the open subset is not a complete harvest of zbMATH."
      verified: false
      unverified_reason: "documented from the provider's own publication pages; not checked against a live fetch in this revision"
    notes: "MSC classification codes are preserved with their scheme (e.g. msc2020) rather than normalized to one edition, since the same numeric code names a different subject across the 2000/2010/2020 revisions. Reviews (editorial_contributions) are preserved as a distinct field from the bibliographic record, each carrying its own reviewer sign and contribution type, never folded into asset discovery or treated as redistributable under the record's rights. An OAI-PMH endpoint at oai.zbmath.org/v1/ answered Identify unauthenticated during verification, so incremental_updates is true; no full-corpus bulk export for unauthenticated use was found, so bulk_access is false. Open since 2021 (post-zbMATH-classic). Verified live against api.zbmath.org and oai.zbmath.org 2026-08-17."

