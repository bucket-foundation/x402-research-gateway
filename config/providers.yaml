      section: "1.11"
      notes: 'x402-research-gateway#19 verification: PubMed''s own correction/retraction reference types are not wired directly. Europe PMC''s commentCorrectionList (internal/provider/integrity_adapters.go''s epmcIdentity.IntegrityAssertions, x402-research-gateway#9) already carries this data for the same PubMed record set, since Europe PMC indexes PubMed and republishes the relation under its own field name; docs/INTEGRITY.md and the europe-pmc registry entry describe that coverage. This entry stays `registered` rather than `implemented` because building a second, separate XML parser over PubMedFetchAdapter for a relation Europe PMC already surfaces adds a maintenance path with no new integrity coverage: the two providers would report from the same underlying NCBI notice, not independent sources, so nothing about disagreement-tracking (the reason two providers over one DOI are worth keeping distinct) motivates it. If the gateway ever adds a direct EFetch XML Normalizer for other reasons (structured abstracts, MeSH terms on the record), wiring an IntegrityProvider on top of it at that point is a small addition, not a new integration.'
    - provider_id: retraction-watch-crossref-dataset
      name: Retraction Watch Database (via Crossref)
      provider_type: retraction_update_source
      fields:
        - cross_cutting
      coverage: 'The original Retraction Watch database (~60k+ retraction/correction records, 18 fields: RecordID, Title, Subject, Institution, Journal, Publisher, Country, Author, URLs, ArticleType, RetractionDate, RetractionDOI, RetractionPubMedID, OriginalPaperDate, OriginalPaperDOI, OriginalPaperPubMedID, RetractionNature, Reason, Paywalled, Notes), acquired by Crossref from the Center for Scientific Integrity in 2023 and published as a standalone dataset, separate from the retraction signal already exposed per-DOI through the crossmark entry''s update-to/updated-by fields on the ordinary Crossref works API.'
      base_url: https://gitlab.com/crossref/retraction-watch-data
      license: unverified this session
      rights:
        terms_url: https://www.crossref.org/blog/news-crossref-and-retraction-watch/
        verified_on: "2026-08-18"
        redistribution: unknown
        notes: 'Verified live 2026-08-18 (WebFetch against crossref.org''s own announcement and documentation pages, retractionwatch.com''s user guide, and the gitlab.com/crossref/retraction-watch-data README). Crossref''s own documentation states retractions from this acquisition ''appear in the update-to field via the Crossref REST API'' -- i.e. the per-DOI signal is already the crossmark entry above, under Crossref''s confirmed CC0 metadata terms, and no separate integration is needed for that. This entry is specifically about the standalone bulk artifact: a CSV/git-repository dump of the full historical database, distributed at the base_url above. Neither Crossref''s announcement, Crossref''s REST API documentation, retractionwatch.com''s user guide, nor the dataset''s own README (read directly at gitlab.com/crossref/retraction-watch-data/-/raw/main/README.md) states an explicit license (no CC0/CC-BY/other SPDX identifier, no LICENSE file content surfaced) or an explicit redistribution/commercial-use permission for the bulk file, despite describing the acquisition as making the database ''a public resource'' and ''publicly available.'' ''Publicly available'' and ''freely readable'' are not license grants, and this registry treats an unstated licence as unknown, which forbids redistribution per this file''s own convention (see the file header). Per x402-research-gateway#19''s explicit instruction (no scraping of restricted or unclearly licensed data; a source whose terms are unverified is registered without operational endpoints), this entry carries no route_ids, no base_url the gateway calls, and no adapter: it is registry-only, describing that the source exists and what it covers with a link, until a human confirms an explicit licence for the bulk dataset (or the gateway continues relying solely on the per-DOI crossmark path above, which needs no separate licence because it inherits Crossref''s own CC0 terms).'
      status: registered
      last_verified: "2026-08-22"
      last_checked: "2026-08-22"
      section: "1.11"
      notes: Do NOT scrape or bulk-download this dataset from gitlab.com/crossref/retraction-watch-data without a human confirming its licence first. The gateway's operational retraction/correction coverage for Crossref-indexed works already comes from the crossmark entry above, which is CC0 and needs no separate permission.
