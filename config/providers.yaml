    notes: "Citation relations as data. Index v2 at api.opencitations.net supersedes the COCI v1 path, and the per-source indexes (COCI over Crossref, DOCI over DataCite, POCI over PubMed) are served through the one unified Index. Identifiers take a scheme prefix (doi:, pmid:, omid:). Edge fields: oci, citing, cited, creation, timespan, journal_sc, author_sc, all preserved on the edge. Bulk dumps of Index (2.5B+ citations, released 2026-07-28) and Meta (147M+ entities, released 2026-06-27) are published to Zenodo, Figshare, and the Internet Archive; cadence is periodic rather than scheduled. Coverage depends on publishers depositing open references and is uneven by publisher, discipline, and era, so an empty answer is this collection having no edge on record. Verified 2026-08-17."

