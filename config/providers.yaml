    - provider_id: crossmark
      name: Crossmark (Crossref)
      provider_type: retraction_update_source
      fields:
        - cross_cutting
      coverage: Crossmark update relations (correction, erratum, retraction, withdrawal, expression of concern, new edition), asserted by the publisher and deposited on the Crossref work record's own `update-to` and `updated-by` fields. This is the same Crossref REST surface the crossref provider entry describes; Crossmark is not a separate API, it is a field on that record, so this entry claims no route of its own -- see the crossref entry's route_ids (crossref-search, crossref-fetch) for where it is actually served.
      license: CC0
      rights:
        metadata_license: CC0
        terms_url: https://www.crossref.org/documentation/retrieve-metadata/rest-api/
        verified_on: "2026-08-18"
        redistribution: allowed
        notes: The update relation is a field on the CC0 Crossref metadata record, so it carries the same licence as the rest of that record (see the crossref provider entry). No separate Crossmark subscription or terms apply to reading update-to/updated-by through the public REST API; the Crossmark badge/widget service publishers embed on their own sites is a different, publisher-facing product this gateway does not use.
      identifier_schemes:
        - doi
      source_prefix: crossref
      canonical_url: https://doi.org/{doi}
      status: registered
      last_verified: "2026-08-22"
      last_checked: "2026-08-22"
      section: "1.11"
      notes: 'Implemented in internal/provider/integrity_adapters.go''s crossrefIdentity.IntegrityAssertions (x402-research-gateway#9). Registered here as its own integrity source per #19''s requirement that a source-side registry entry exist for the provider of update/retraction data, distinct from the crossref entry''s general scholarly-metadata registration. status is `registered` rather than `implemented` because route_ids and base_url belong to the crossref entry, which is the one route reconciliation may assign a route to; this entry describes the same upstream field from the integrity-source side without double-claiming the route.'
