  - provider_id: "crossref"
    name: "CrossRef"
    provider_type: scholarly_metadata
    status: implemented
    section: "1.9"
    fields:
      - cross_cutting
    coverage: "DOI metadata, refs, funders"
    corpus_size: "~160M works"
    base_url: "https://api.crossref.org/works?query=..."
    source_prefix: "crossref"
    canonical_url: "https://doi.org/{doi}"
    tier_fit: "raw (`/works/{doi}`), query"
    auth: "none; `mailto` joins the polite pool"
    rate_limit: "public pool 5 req/s single-record and 1 req/s list; polite pool 10 req/s single-record and 3 req/s list, 3 concurrent (changed 2025-12-01)"
    license: "CC0"
    rights:
      metadata_license: "CC0"
      redistribution: allowed
      notes: "CC0 covers the Crossref metadata record. It does not cover content at a `link` URL, which is the publisher's and carries its own terms, described by the work's `license` array where one was deposited. Metadata rights and content rights are separate; unknown content rights are not permission."
    identifier_schemes:
      - doi
    pagination: "rows + offset up to 10000; cursor=* with next-cursor for deep paging, cursors expire after 5 minutes"
    bulk_access: false
    incremental_updates: true
    last_verified: "2026-08-17"
    route_ids:
      - crossref-search
      - crossref-fetch
      - crossref-references
    sync:
      modes:
        - incremental_cursor
        - date_window
      incremental_method: "from-index-date filter on /works with cursor=* deep paging"
      cursor_semantics: "Cursors expire after about five minutes, so a resumed harvest restarts from the last from-index-date rather than from the last cursor."
      snapshots:
        - url: "https://www.crossref.org/services/metadata-retrieval/metadata-plus/"
          format: "monthly full corpus dump"
          update_frequency: "monthly"
          auth: "subscription"
