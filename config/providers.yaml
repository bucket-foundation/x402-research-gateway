    - provider_id: crossref
      name: CrossRef
      provider_type: scholarly_metadata
      fields:
        - cross_cutting
      coverage: DOI metadata, refs, funders
      base_url: https://api.crossref.org/works?query=...
      auth: none; `mailto` joins the polite pool
      rate_limit: public pool 5 req/s single-record and 1 req/s list; polite pool 10 req/s single-record and 3 req/s list, 3 concurrent (changed 2025-12-01)
      license: CC0
      rights:
        metadata_license: CC0
        terms_url: https://www.crossref.org/documentation/retrieve-metadata/rest-api/
        verified_on: "2026-08-18"
        redistribution: allowed
        notes: CC0 covers the Crossref metadata record. It does not cover content at a `link` URL, which is the publisher's and carries its own terms, described by the work's `license` array where one was deposited. Metadata rights and content rights are separate; unknown content rights are not permission.
      identifier_schemes:
        - doi
      source_prefix: crossref
      canonical_url: https://doi.org/{doi}
      pagination: rows + offset up to 10000; cursor=* with next-cursor for deep paging, cursors expire after 5 minutes
      sync:
        modes:
            - incremental_cursor
            - date_window
        snapshots:
            - url: https://www.crossref.org/services/metadata-retrieval/metadata-plus/
              format: monthly full corpus dump
              update_frequency: monthly
              auth: subscription
              rights:
                metadata_license: CC0 for the metadata records
                redistribution: unknown
                notes: The dump is a paid Metadata Plus product with its own terms. The gateway holds no subscription, so this snapshot is described and never exercised.
        incremental_method: from-index-date filter on /works with cursor=* deep paging
        cursor_semantics: Cursors expire after about five minutes, so a resumed harvest restarts from the last from-index-date rather than from the last cursor.
        unverified_reason: documented from the provider's own publication pages; not checked against a live fetch in this revision
      incremental_updates: true
      status: implemented
      last_verified: "2026-08-22"
      last_checked: "2026-08-22"
      historical_from: 1700
      languages:
        - en
        - de
        - fr
        - es
        - pt
        - zh
        - ja
        - ru
      coverage_depth_note: The earliest deposited works predate 1800; 1700 is a floor rather than a measured minimum, and the field is a coverage hint, not a claim about the oldest record.
      corpus_size: ~160M works
      tier_fit: raw (`/works/{doi}`), query
      route_ids:
        - crossref-search
        - crossref-fetch
        - crossref-references
      section: "1.9"
      notes: 'Polite pool header `User-Agent: ...mailto:...`, plus a `mailto` query param. No API key. Reference lists come from `/works/{doi}` -> message.reference, present only where the publisher deposits references openly; an absent list is a publisher that did not deposit, never evidence a work has no references. Crossmark update relations come from `update-to` and `updated-by`. Bulk: whole-corpus monthly dumps are the paid Metadata Plus tier, so bulk_access is false for this gateway; incremental harvest via `from-index-date` plus cursor paging is open. Verified 2026-08-17.'
