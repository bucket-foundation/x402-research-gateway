    - provider_id: lmfdb
      name: LMFDB
      provider_type: mathematical_object_database
      fields:
        - mathematics
      coverage: 'L-functions, modular forms, number-theory objects across dozens of independent tables (elliptic curves, modular forms, L-functions, number fields, ...). The adapter is table-agnostic by design: normalizing every field each table publishes would require one struct per table and contradicts native-structure preservation, so only the shared {table, data[]} envelope is parsed and each row''s own fields are preserved verbatim on Raw regardless of table.'
      base_url: https://www.lmfdb.org/api/{table}/
      auth: none
      rate_limit: polite; no numeric ceiling published
      license: CC-BY-SA (unverified this pass)
      rights:
        metadata_license: CC-BY-SA (as previously recorded; not independently reverified)
        terms_url: https://www.lmfdb.org/license
        verified_on: "2026-08-18"
        redistribution: allowed
        notes: 'lmfdb.org/license sits behind a JavaScript "prove you''re human" interstitial this verification pass could not get past without a browser. The CC-BY-SA designation carried over from a prior registry entry is left as previously recorded rather than re-asserted as freshly verified; flagged here as unverified this pass per #17''s own instruction to flag rather than block.'
      identifier_schemes:
        - lmfdb-row
      source_prefix: lmfdb
      canonical_url: https://www.lmfdb.org/api/{table}/?_format=json&id={id}
      pagination: offset (_offset/_limit query params)
      formats:
        - json
      status: implemented
      last_verified: "2026-08-22"
      last_checked: "2026-08-22"
      corpus_size: 10M+ objects
      tier_fit: raw, query
      section: "1.1"
      notes: internal/provider/lmfdb.go's LMFDBNormalizer parses the shared table-response envelope; LMFDB has no dedicated single-object endpoint, only the same table query filtered to one row, so lmfdb-fetch reuses the search route's shape with a field filter. API is documented as v0/beta; HTML scrape fallback remains viable if it changes shape. x402-research-gateway#17.
