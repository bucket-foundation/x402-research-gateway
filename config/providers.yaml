          format: "one XML document with its DTD, gzipped"
          update_frequency: "monthly, with the current file republished continuously"
          auth: "none"
          rights:
            metadata_license: "CC0-1.0"
            redistribution: allowed
            notes: "DBLP publishes its dataset under CC0 1.0 per its dataset FAQ."
          notes: "One document rather than a partitioned set, so a client takes all of it or none."
