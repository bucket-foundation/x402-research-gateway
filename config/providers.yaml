    corpus_size: "~600k math preprints"
    base_url: "http://export.arxiv.org/api/query?search_query=cat:math.*"
    source_prefix: "arxiv"
    canonical_url: "https://arxiv.org/abs/{id}"
    tier_fit: "raw (by id), query (search)"
    auth: "none"
    rate_limit: "1 req/3s polite"
    license: "arXiv non-exclusive (metadata free; PDF per-paper)"
    rights:
