port: 8091
recipientAddress: "${RECIPIENT_ADDRESS}"
network: "${NETWORK:-base-sepolia}"
facilitatorUrl: "${FACILITATOR_URL:-https://facilitator.x402.rs}"
defaultPrice: "0.001"

# feed402 protocol compliance layer (see github.com/.../feed402 SPEC).
# When enabled, serves /.well-known/feed402.json and wraps every paid
# response in the feed402 §3 envelope (data + citation + receipt).
feed402:
  enabled: true
  name: x402-research-gateway
  version: "0.1.0"
  spec: "feed402/0.3"
  citationPolicy: "mixed"   # per-route licenses below override
  contact: "research@viatika.ai"
  # feed402 insight-tier endpoint. Synthesizes a short LLM answer over
  # results from retrievalRouteId. Pricing: cheapest of the three tiers
  # (SPEC §5). When OPENAI_API_KEY is unset the gateway defaults to the
  # mock summarizer so it boots without external deps.
  insight:
    enabled: true
    path: /research/insight
    price: "0.005"
    description: "Paid LLM-summarized research insight over PubMed retrieval"
    retrievalRouteId: pubmed-search
    summarizer: ""          # auto: openai if OPENAI_API_KEY else mock
    model: gpt-4o-mini
    maxContextChars: 4000
  # Cross-provider identity resolution (x402-research-gateway#5). Takes one
  # identifier, asks every route whose adapter implements IdentityProvider,
  # and returns a relation graph. Provider records are never merged: each
  # stays an addressable node and the relations between them are the answer.
  resolve:
    enabled: true
    path: /research/resolve
    price: "0.005"
    description: "Resolve one scholarly identifier across providers into a relation graph"
    # Empty providerRouteIds means every identity-capable route.
    providerRouteIds: []
    maxConcurrency: 4
    timeoutSeconds: 10
    # Minimum title/author similarity reported as possible_same_work. It is
    # never promoted to same_work at any score.
    similarityThreshold: 0.82
  # Citation graph across providers (x402-research-gateway#6). Takes an
  # identifier plus a direction, asks every provider serving that
  # direction, and reports what each one returned including nothing.
  citations:
    enabled: true
    path: /research/citations
    price: "0.005"
    description: "Normalized citation graph across OpenAlex, Semantic Scholar, OpenCitations, and Crossref"
    providerRouteIds: []
    maxConcurrency: 4
    timeoutSeconds: 10
  # Federated multi-provider search (x402-research-gateway#4). POST is the
  # paid fan-out; GET on the same path is free and returns the cost
  # estimate, so an agent can price a call and set a cap before paying.
  federated:
    enabled: true
    path: /research/federated
    price: "0.005"
    description: "Federated search across every provider declaring a capability, with per-provider provenance preserved"
    providerRouteIds: []
    maxConcurrency: 4
    timeoutSeconds: 10

routes:
  # --- Health / Longevity / Nutrition / Psychedelics / Brain Chemistry ---

  - id: pubmed-search
    path: /research/pubmed/search
    method: GET
    description: "Search PubMed biomedical literature (36M+ citations). Covers health, longevity, nutrition, psychedelics, brain chemistry, neuroscience."
    price: "0.001"
    cacheTtlSeconds: 3600
    feed402Tier: query
    citation:
      sourcePrefix: pubmed
      providerUrl: https://pubmed.ncbi.nlm.nih.gov/
      license: public-domain
    upstream:
      baseUrl: https://eutils.ncbi.nlm.nih.gov/entrez/eutils
      path: /esearch.fcgi
      queryParams:
        db: pubmed
        retmode: json
        retmax: "20"
      passThrough: [term, retmax, retstart, sort, mindate, maxdate, datetype]
      timeoutSeconds: 15

  - id: pubmed-fetch
    path: /research/pubmed/fetch
    method: GET
    description: "Fetch PubMed article abstracts by PMID. Returns full structured abstract with MeSH terms."
    price: "0.002"
    cacheTtlSeconds: 86400
    feed402Tier: raw
    citation:
      sourcePrefix: pubmed
      canonicalUrlTemplate: https://pubmed.ncbi.nlm.nih.gov/{id}/
      providerUrl: https://pubmed.ncbi.nlm.nih.gov/
      license: public-domain
    upstream:
      baseUrl: https://eutils.ncbi.nlm.nih.gov/entrez/eutils
      path: /efetch.fcgi
      queryParams:
        db: pubmed
        retmode: xml
        rettype: abstract
      passThrough: [id]
      timeoutSeconds: 15

  # --- Cross-Disciplinary / Polymathic ---

  - id: semantic-scholar-search
    path: /research/semantic-scholar/search
    method: GET
    description: "Search Semantic Scholar (200M+ papers). Physics, math, chemistry, CS, biology, medicine, history. AI-powered TLDR summaries and citation graphs."
    price: "0.002"
    cacheTtlSeconds: 1800
    feed402Tier: query
    citation:
      sourcePrefix: s2
      providerUrl: https://www.semanticscholar.org/
      license: CC-BY-NC-4.0
    upstream:
      baseUrl: https://api.semanticscholar.org
      path: /graph/v1/paper/search
      passThrough: [query, limit, offset, fields, year, fieldsOfStudy]
      timeoutSeconds: 20

  - id: openalex-works
    path: /research/openalex/works
    method: GET
    description: "Search OpenAlex scholarly works (hundreds of millions, CC0 open data). All disciplines. Successor to Microsoft Academic Graph."
    price: "0.001"
    cacheTtlSeconds: 1800
    feed402Tier: query
    citation:
      sourcePrefix: openalex
      providerUrl: https://openalex.org/
      license: CC0
    upstream:
      baseUrl: https://api.openalex.org
      path: /works
      headers:
        User-Agent: "x402-research-gateway/1.0 (mailto:research@viatika.ai)"
      passThrough: [search, filter, sort, per_page, page, select]
      timeoutSeconds: 15

  # --- Clinical Trials / Drug Research ---

  - id: clinicaltrials-search
    path: /research/clinicaltrials/search
    method: GET
    description: "Search ClinicalTrials.gov (400K+ studies). Find clinical trials for psychedelics, longevity interventions, nutrition studies, drug candidates."
    price: "0.002"
    cacheTtlSeconds: 3600
    feed402Tier: query
    citation:
      sourcePrefix: nct
      providerUrl: https://clinicaltrials.gov/
      license: public-domain
    upstream:
      baseUrl: https://clinicaltrials.gov/api/v2
      path: /studies
      queryParams:
        format: json
        pageSize: "10"
      passThrough: ["query.term", "query.cond", "query.intr", filter.overallStatus, pageSize, pageToken, sort]
      timeoutSeconds: 20

  # --- Chemistry / Compounds ---

  - id: pubchem-compound
    path: /research/pubchem/compound
    method: GET
    description: "Look up chemical compounds in PubChem (300M+ substances). Search by name for DMT, psilocybin, serotonin, dopamine, any compound. Pass ?name=compound_name"
    price: "0.001"
    cacheTtlSeconds: 86400
    feed402Tier: raw
    citation:
      sourcePrefix: pubchem
      canonicalUrlTemplate: https://pubchem.ncbi.nlm.nih.gov/#query={name}
      providerUrl: https://pubchem.ncbi.nlm.nih.gov/
      license: public-domain
    upstream:
      baseUrl: https://pubchem.ncbi.nlm.nih.gov/rest/pug
      pathTemplate: /compound/name/{name}/property/MolecularFormula,MolecularWeight,IUPACName,CanonicalSMILES,IsomericSMILES/JSON
      passThrough: [name]
      timeoutSeconds: 15

  # --- Citation graph (x402-research-gateway#6) ---
  # One route per provider per direction. The /research/citations endpoint
  # fans out across these; each is also independently addressable, so
  # single-provider access stays available.

  - id: openalex-references
    path: /research/openalex/references
    method: GET
    description: "OpenAlex outbound citations: the works an OpenAlex work references."
    price: "0.001"
    cacheTtlSeconds: 1800
    feed402Tier: query
    citation:
      sourcePrefix: openalex
      providerUrl: https://openalex.org/
      license: CC0
    upstream:
      baseUrl: https://api.openalex.org
      path: /works
      headers:
        User-Agent: "x402-research-gateway/1.0 (mailto:research@viatika.ai)"
      passThrough: [filter, per_page, cursor, select]
      timeoutSeconds: 15

  - id: openalex-cited-by
    path: /research/openalex/cited-by
    method: GET
    description: "OpenAlex inbound citations: the works citing an OpenAlex work."
    price: "0.001"
    cacheTtlSeconds: 1800
    feed402Tier: query
    citation:
      sourcePrefix: openalex
      providerUrl: https://openalex.org/
      license: CC0
    upstream:
      baseUrl: https://api.openalex.org
      path: /works
      headers:
        User-Agent: "x402-research-gateway/1.0 (mailto:research@viatika.ai)"
      passThrough: [filter, per_page, cursor, select]
      timeoutSeconds: 15

  - id: semantic-scholar-references
    path: /research/semantic-scholar/references
    method: GET
    description: "Semantic Scholar outbound citations for a paper."
    price: "0.002"
    cacheTtlSeconds: 1800
    feed402Tier: query
    citation:
      sourcePrefix: s2
      providerUrl: https://www.semanticscholar.org/
      license: CC-BY-NC-4.0
    upstream:
      baseUrl: https://api.semanticscholar.org
      pathTemplate: /graph/v1/paper/{id}/references
      passThrough: [id, fields, offset, limit]
      timeoutSeconds: 20

  - id: semantic-scholar-cited-by
    path: /research/semantic-scholar/cited-by
    method: GET
    description: "Semantic Scholar inbound citations for a paper."
    price: "0.002"
    cacheTtlSeconds: 1800
    feed402Tier: query
    citation:
      sourcePrefix: s2
      providerUrl: https://www.semanticscholar.org/
      license: CC-BY-NC-4.0
    upstream:
      baseUrl: https://api.semanticscholar.org
      pathTemplate: /graph/v1/paper/{id}/citations
      passThrough: [id, fields, offset, limit]
      timeoutSeconds: 20

  # OpenCitations rate-limits to 180 req/min per IP without an access
  # token. Set OPENCITATIONS_TOKEN to send one; the gateway omits the
  # header when the variable is unset, which the API accepts.
  - id: opencitations-references
    path: /research/opencitations/references
    method: GET
    description: "OpenCitations Index outbound references for a DOI or PMID."
    price: "0.001"
    cacheTtlSeconds: 3600
    feed402Tier: query
    citation:
      sourcePrefix: opencitations
      providerUrl: https://opencitations.net/
      license: CC0
    upstream:
      baseUrl: https://api.opencitations.net
      pathTemplate: /index/v2/references/{id}
      headers:
        User-Agent: "x402-research-gateway/1.0 (mailto:research@viatika.ai)"
      passThrough: [id]
      timeoutSeconds: 20

  - id: opencitations-cited-by
    path: /research/opencitations/cited-by
    method: GET
    description: "OpenCitations Index inbound citations for a DOI or PMID."
    price: "0.001"
    cacheTtlSeconds: 3600
    feed402Tier: query
    citation:
      sourcePrefix: opencitations
      providerUrl: https://opencitations.net/
      license: CC0
    upstream:
      baseUrl: https://api.opencitations.net
      pathTemplate: /index/v2/citations/{id}
      headers:
        User-Agent: "x402-research-gateway/1.0 (mailto:research@viatika.ai)"
      passThrough: [id]
      timeoutSeconds: 20

  # Crossref serves outbound references only. There is no cited-by route
  # because Crossref has no cited-by endpoint, and a missing route reports
  # as unsupported_direction rather than as a provider with no edges.
  - id: crossref-references
    path: /research/crossref/references
    method: GET
    description: "Crossref deposited reference list for a DOI."
    price: "0.001"
    cacheTtlSeconds: 3600
    feed402Tier: query
    citation:
      sourcePrefix: crossref
      providerUrl: https://www.crossref.org/
      license: CC0
    upstream:
      baseUrl: https://api.crossref.org
      pathTemplate: /works/{id}
      headers:
        User-Agent: "x402-research-gateway/1.0 (mailto:research@viatika.ai)"
      queryParams:
        mailto: research@viatika.ai
      passThrough: [id]
      timeoutSeconds: 20

  # --- Crossref (x402-research-gateway#23) ---
  # Metadata is CC0. Content behind a `link` is the publisher's and carries
  # its own terms; the two rights are recorded separately in providers.yaml.
  - id: crossref-search
    path: /research/crossref/search
    method: GET
    description: "Search Crossref DOI metadata (~160M works, CC0). All disciplines. The DOI registration agency for most scholarly publishing."
    price: "0.001"
    cacheTtlSeconds: 3600
    feed402Tier: query
    citation:
      sourcePrefix: crossref
      providerUrl: https://www.crossref.org/
      license: CC0
    upstream:
      baseUrl: https://api.crossref.org
      path: /works
      headers:
        User-Agent: "x402-research-gateway/1.0 (mailto:research@viatika.ai)"
      queryParams:
        mailto: research@viatika.ai
      passThrough: [query, rows, offset, cursor, filter, sort, select, from-index-date]
      timeoutSeconds: 20

  - id: crossref-fetch
    path: /research/crossref/fetch
    method: GET
    description: "Fetch a single Crossref work record by DOI."
    price: "0.001"
    cacheTtlSeconds: 3600
    feed402Tier: raw
    citation:
      sourcePrefix: crossref
      providerUrl: https://www.crossref.org/
      license: CC0
    upstream:
      baseUrl: https://api.crossref.org
      pathTemplate: /works/{id}
      headers:
        User-Agent: "x402-research-gateway/1.0 (mailto:research@viatika.ai)"
      queryParams:
        mailto: research@viatika.ai
      passThrough: [id]
      timeoutSeconds: 20
