  # --- CORE (x402-research-gateway#8) ---
  # CORE needs a free API key from core.ac.uk/services/api. The gateway
  # holds no key: CORE_API_KEY comes from the operator's environment, and
  # with it unset these routes send an empty bearer and CORE answers 401,
  # which the asset endpoint reports as an upstream status rather than as
  # "no copy found". Comment the routes out on a deployment with no key.
  - id: core-search
    path: /research/core/search
    method: GET
    description: "CORE open-access aggregator search, for full-text location discovery."
    price: "0.001"
    cacheTtlSeconds: 3600
    feed402Tier: query
    citation:
      sourcePrefix: core
      providerUrl: https://core.ac.uk/
      license: per-record
    upstream:
      baseUrl: https://api.core.ac.uk
      path: /v3/search/works
      headers:
        Authorization: "Bearer ${CORE_API_KEY}"
      passThrough: [q, limit, offset]
      timeoutSeconds: 20

  - id: core-fetch
    path: /research/core/fetch
    method: GET
    description: "CORE single work record."
    price: "0.001"
    cacheTtlSeconds: 3600
    feed402Tier: raw
    citation:
      sourcePrefix: core
      providerUrl: https://core.ac.uk/
      license: per-record
    upstream:
      baseUrl: https://api.core.ac.uk
      pathTemplate: /v3/works/{id}
      headers:
        Authorization: "Bearer ${CORE_API_KEY}"
      passThrough: [id]
      timeoutSeconds: 20

  # --- ORCID (x402-research-gateway#29) ---
  # The gateway's first credentialed provider: authTokenSource: orcid names
  # the internal/auth.ClientCredentialsSource registered from
  # ORCID_CLIENT_ID/ORCID_CLIENT_SECRET at startup (cmd/gateway/main.go),
  # which mints and caches a client-credentials bearer token
  # (grant_type=client_credentials, scope=/read-public) against
  # https://orcid.org/oauth/token. No static Authorization header: the
  # token is minted, cached ~20 years per ORCID's own expires_in, and
  # injected by internal/handler/proxy.go, never written into this file.
  - id: orcid-fetch
    path: /research/orcid/fetch
    method: GET
    description: "ORCID researcher record by ORCID iD."
    price: "0.001"
    cacheTtlSeconds: 86400
    feed402Tier: raw
    citation:
      sourcePrefix: orcid
      providerUrl: https://orcid.org/
      license: CC0
    upstream:
      baseUrl: https://pub.orcid.org
      pathTemplate: /v3.0/{id}/record
      headers:
        User-Agent: "x402-research-gateway/1.0 (mailto:research@viatika.ai)"
      passThrough: [id]
      authTokenSource: orcid
      timeoutSeconds: 20

  - id: orcid-search
    path: /research/orcid/search
    method: GET
    description: "ORCID researcher search (SOLR syntax) over public identity records."
    price: "0.001"
    cacheTtlSeconds: 3600
    feed402Tier: query
    citation:
      sourcePrefix: orcid
      providerUrl: https://orcid.org/
      license: CC0
    upstream:
      baseUrl: https://pub.orcid.org
      path: /v3.0/expanded-search/
      headers:
        User-Agent: "x402-research-gateway/1.0 (mailto:research@viatika.ai)"
      passThrough: [q, start, rows]
      authTokenSource: orcid
      timeoutSeconds: 20

  # --- USPTO Open Data Portal (x402-research-gateway#18) ---
  # USPTO ODP replaced the retired PatentsView API on 2026-03-20. Needs an
  # ODP API key from data.uspto.gov (account setup includes a profile
  # completeness requirement USPTO phased in during 2026); the gateway
  # holds no key of its own. USPTO_ODP_API_KEY comes from the operator's
  # environment via the ${VAR} substitution below, the same static-secret
  # pattern CORE_API_KEY uses. With it unset the upstream sends an empty
  # X-API-KEY and USPTO answers unauthorized, reported as an upstream
  # status rather than as "no patents found."
  - id: uspto-search
    path: /research/uspto/search
    method: GET
    description: "USPTO Open Data Portal patent application search (US jurisdiction only)."
    price: "0.001"
    cacheTtlSeconds: 3600
    feed402Tier: query
    citation:
      sourcePrefix: uspto
      providerUrl: https://data.uspto.gov/
      license: public-domain
    upstream:
      baseUrl: https://api.uspto.gov
      path: /api/v1/patent/applications/search
      headers:
        X-API-KEY: "${USPTO_ODP_API_KEY}"
      passThrough: [q, limit, offset]
      timeoutSeconds: 20

  - id: uspto-fetch
    path: /research/uspto/fetch
    method: GET
    description: "USPTO Open Data Portal single application record, by application number."
    price: "0.001"
    cacheTtlSeconds: 3600
    feed402Tier: raw
    citation:
      sourcePrefix: uspto
      providerUrl: https://data.uspto.gov/
      license: public-domain
    upstream:
      baseUrl: https://api.uspto.gov
      pathTemplate: /api/v1/patent/applications/{id}
      headers:
        X-API-KEY: "${USPTO_ODP_API_KEY}"
      passThrough: [id]
      timeoutSeconds: 20
